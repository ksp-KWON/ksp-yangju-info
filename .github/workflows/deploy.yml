name: 양주인 자동 포스팅 파이프라인

on:
  schedule:
    # 매시 정각 08:00~19:00 (KST) = UTC 23:00, 00:00~10:00 (하루 12회)
    - cron: '0 23,0-10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 양주시 공식 블로그 RSS 수집
        run: node scripts/fetch-city-rss.js

      - name: 공공데이터 복지 수집
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-public-data.js || true

      - name: 블로그 포스트 자동 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.js

      - name: CQF 품질 검증 게이트
        run: node scripts/check-quality.js

      - name: 신규 포스트 커밋 및 푸시
        run: |
          git config user.name "ksp-KWON"
          git config user.email "286907395+ksp-KWON@users.noreply.github.com"
          git add src/content/posts/ public/data/
          if git diff --staged --quiet; then
            echo "신규 생성된 포스트가 없습니다. 푸시를 건너뜁니다."
          else
            git commit -m "auto: 양주 시정 새소식 자동 발행 업데이트 $(date '+%Y-%m-%d %H:%M')"
            git push origin main
          fi
