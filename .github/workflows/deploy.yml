name: 양주인 통합 자동화 파이프라인

on:
  schedule:
    # 매시간 정각 24시간 실행
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── [1단계] 자동 글쓰기 (schedule / workflow_dispatch 트리거 시만 실행) ──
  generate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      new_posts_count: ${{ steps.extract_posts.outputs.new_posts_count }}
      subject: ${{ steps.extract_posts.outputs.subject }}
      html_body: ${{ steps.extract_posts.outputs.html_body }}
      cache_changed: ${{ steps.cache_check.outputs.cache_changed }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 24 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 양주시 공식 블로그 RSS 수집
        run: node scripts/fetch-city-rss.js

      - name: 공공데이터 수집
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-public-data.js || true

      - name: 평생학습 강좌 캐시 갱신
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/build-learning-cache.js

      - name: 블로그 자동글쓰기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.js

      - name: 구버전 글 백필 업그레이드 (신규 글 미발행 시)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_VISION_OCR: '1'
        run: |
          if [ -z "$(git status --porcelain src/content/posts/)" ]; then
            echo "이번 회차 신규 발행 글 없음 -> 유휴 쿼터로 구버전 글 1건 업그레이드 실행"
            node scripts/upgrade-old-posts.js
          else
            echo "신규 글 발행 확인됨 -> 구버전 업그레이드 건너뜀 (쿼터 분산)"
          fi

      - name: CQF 품질 검증 게이트
        run: node scripts/check-quality.js

      - name: 변경사항 스테이징
        run: |
          git add public/data/city-rss.json public/data/local-info.json public/data/learning-courses.json public/data/skipped-urls.json public/data/upgrade-skipped.json src/data/learning-courses.json src/content/posts/ || true

      - name: 캐시 변경 여부
        id: cache_check
        run: |
          if git diff --cached --quiet -- src/data/learning-courses.json public/data/learning-courses.json; then
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 신규 발행 글 추출 및 메타데이터 구성
        id: extract_posts
        run: node scripts/extract-posts-metadata.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --cached --quiet; then
            git commit -m "auto: 양주 시정 새소식 자동 발행 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
            echo "✅ 커밋 & 푸시 완료"
          else
            echo "ℹ️ 변경사항 없음 — 커밋 건너뜀"
          fi

  # ── [2단계] 빌드 & 배포 & 이메일 발송 ─────────────────────────────────────
  deploy:
    needs: [generate]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' || needs.generate.outputs.new_posts_count > 0 || needs.generate.outputs.cache_changed == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js 24 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 프로젝트 빌드
        run: npm run build

      - name: Cloudflare Workers 배포
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && exit 0
            sleep 15
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 배포 완료 브리핑 이메일 발송
        if: needs.generate.outputs.new_posts_count > 0 && env.GMAIL_USER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ needs.generate.outputs.subject }}
          to: ${{ secrets.GMAIL_USER }}
          from: 양주인 포털 <${{ secrets.GMAIL_USER }}>
          html_body: ${{ needs.generate.outputs.html_body }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
